name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check private-stats credential
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo '::error::Add the STATS_TOKEN Actions secret with access to your private repositories.'
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate stats including private commits
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          core_version: '2.2.0'
          fail_on_error: 'true'
          token: ${{ secrets.STATS_TOKEN }}
          path: assets/stats.svg
          options: username=Ghovkg02&show_icons=true&include_all_commits=true&hide_border=true&bg_color=000000&title_color=FFFFFF&text_color=BBBBBB&icon_color=FFFFFF&ring_color=FFFFFF&rank_icon=percentile&number_format=long&disable_animations=true

      - name: Publish changed card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update profile stats'
          git push
